<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oleh-Oleh Khas Jakarta — APTIRMIKI</title>
  <meta name="description" content="Pemesanan Oleh-Oleh Resmi Acara APTIRMIKI" />
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0056d2",
            secondary: "#e60012",
            gold: "#0056d2",
            cream: "#f0f6ff",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen bg-[--color-cream] text-gray-800 flex flex-col justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-blue-50 shadow-sm">
    <div class="max-w-screen-2xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 flex items-center justify-between gap-2">
      <button data-action="go-katalog" class="flex items-center gap-2 sm:gap-3 text-left group min-w-0 flex-1">
        <img src="/images/logo.svg" alt="APTIRMIKI Logo" class="w-8 h-8 sm:w-10 sm:h-10 object-contain shrink-0 group-hover:scale-105 transition-transform" />
        <div class="flex flex-col min-w-0">
          <span id="event-title" class="font-bold text-gray-900 leading-tight text-sm sm:text-lg truncate">Oleh-Oleh APTIRMIKI</span>
          <span class="text-[9px] sm:text-[10px] text-[--color-secondary] font-bold tracking-wider uppercase truncate">Katalog Resmi Acara</span>
        </div>
      </button>

      <!-- Desktop Navigation (Tablet & Laptop) -->
      <nav class="hidden md:flex items-center gap-1.5 sm:gap-2">
        <button data-action="go-katalog" data-nav="katalog" class="text-xs sm:text-sm font-semibold text-gray-600 hover:text-[--color-primary] flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-blue-50 transition">
          <svg class="w-4 h-4 text-[--color-primary]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
          </svg>
          <span>Katalog</span>
        </button>
        <button data-action="go-tracking" data-nav="tracking" class="text-xs sm:text-sm font-semibold text-gray-600 hover:text-[--color-primary] flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-blue-50 transition">
          <svg class="w-4 h-4 text-[--color-primary]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Lacak Pesanan</span>
        </button>
        <button data-action="go-riwayat" data-nav="riwayat" class="text-xs sm:text-sm font-semibold text-gray-600 hover:text-[--color-primary] flex items-center gap-1.5 px-3 py-1.5 rounded-full hover:bg-blue-50 transition">
          <svg class="w-4 h-4 text-[--color-primary]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <span>Riwayat</span>
        </button>
      </nav>

      <!-- Mobile Quick Actions -->
      <div class="flex items-center gap-2 md:hidden shrink-0">
        <button onclick="window.location.hash='#/keranjang'" class="relative p-2 rounded-xl bg-blue-50 text-[--color-primary] active:scale-95 transition flex items-center justify-center border border-blue-100" aria-label="Keranjang">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span id="cart-badge-header" class="hidden absolute -top-1 -right-1 bg-[--color-secondary] text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center ring-1 ring-white">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="min-h-[70vh] flex-1 pb-20 md:pb-8"></main>

  <footer class="bg-white border-t border-gray-100 py-6 px-4 text-center text-xs text-gray-400 mt-auto pb-24 md:pb-6">
    <div class="max-w-screen-2xl mx-auto space-y-1">
      <p class="font-medium text-gray-600">Layanan Pemesanan Oleh-Oleh Resmi Acara APTIRMIKI</p>
      <p>© 2026 Panitia APTIRMIKI. Dibuat untuk kemudahan peserta acara.</p>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur border-t border-gray-200 py-1.5 px-2 flex md:hidden items-center justify-around shadow-2xl safe-bottom">
    <button data-action="go-katalog" data-nav="katalog" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-500 hover:text-[--color-primary] active:scale-95 transition">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
      </svg>
      <span class="text-[10px] font-medium leading-tight">Katalog</span>
    </button>
    <button data-action="go-tracking" data-nav="tracking" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-500 hover:text-[--color-primary] active:scale-95 transition">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="text-[10px] font-medium leading-tight">Lacak</span>
    </button>
    <button data-action="go-riwayat" data-nav="riwayat" class="flex flex-col items-center justify-center flex-1 py-1 text-gray-500 hover:text-[--color-primary] active:scale-95 transition">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
      </svg>
      <span class="text-[10px] font-medium leading-tight">Riwayat</span>
    </button>
    <button onclick="window.location.hash='#/keranjang'" class="relative flex flex-col items-center justify-center flex-1 py-1 text-gray-500 hover:text-[--color-primary] active:scale-95 transition">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
      </svg>
      <span id="cart-badge-bottom" class="hidden absolute top-0 right-1/4 bg-[--color-secondary] text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center ring-1 ring-white">0</span>
      <span class="text-[10px] font-medium leading-tight">Keranjang</span>
    </button>
    <a id="wa-bottom" href="#" target="_blank" rel="noopener" class="flex flex-col items-center justify-center flex-1 py-1 text-emerald-600 hover:text-emerald-700 active:scale-95 transition">
      <svg class="w-5 h-5 mb-0.5 fill-current" viewBox="0 0 24 24">
        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-0.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
      </svg>
      <span class="text-[10px] font-medium leading-tight">Bantuan WA</span>
    </a>
  </nav>

  <!-- Desktop Floating Cart & WA (Only on Tablets & Desktops) -->
  <button id="cart-fab" onclick="window.location.hash='#/keranjang'"
    class="hidden md:flex fixed z-40 bottom-24 right-6 lg:right-8 bg-[--color-primary] text-white shadow-xl shadow-blue-500/30 rounded-full w-14 h-14 items-center justify-center hover:scale-105 active:scale-95 transition-all"
    aria-label="Keranjang Belanja">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
    </svg>
    <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-[--color-secondary] text-white text-[11px] font-bold rounded-full w-5 h-5 flex items-center justify-center ring-2 ring-white">0</span>
  </button>

  <a id="wa-float" href="#" target="_blank" rel="noopener"
    class="hidden md:flex fixed z-40 bottom-6 right-6 lg:right-8 bg-emerald-600 hover:bg-emerald-700 text-white shadow-xl shadow-emerald-600/30 rounded-full px-4 py-3 items-center gap-2.5 hover:scale-105 active:scale-95 transition-all group"
    aria-label="Chat WhatsApp Admin">
    <span class="relative flex h-3 w-3">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-200"></span>
    </span>
    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
      <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-0.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
    </svg>
    <span class="text-xs font-semibold tracking-wide hidden sm:inline">Bantuan WA</span>
  </a>

  <!-- Toast Notification -->
  <div id="toast" class="bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
    <span id="toast-msg">Notifikasi</span>
  </div>

  <!-- Centered Animated Success Checkmark Modal -->
  <div id="success-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-all duration-300">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-gray-100 flex flex-col items-center anim-modal-in">
      <div class="w-20 h-20 mb-4 relative flex items-center justify-center anim-checkmark-pop">
        <svg class="w-20 h-20" viewBox="0 0 52 52">
          <circle class="checkmark-circle" cx="26" cy="26" r="23" />
          <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
      </div>
      <h3 id="success-modal-title" class="text-xl font-bold text-gray-900 mb-1">Berhasil!</h3>
      <p id="success-modal-msg" class="text-sm text-gray-500 mb-5 leading-relaxed">Pesanan Anda berhasil diproses.</p>
      <button id="success-modal-close" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
        Lanjutkan
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
